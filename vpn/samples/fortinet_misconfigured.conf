# Fortinet FortiGate IPsec Phase 1 / Phase 2 Configuration (Grade C)
# Weak integrity algorithms and disabled PFS

config vpn ipsec phase1-interface
    edit "Branch-HQ-Tunnel"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes128-sha1 aes256-sha256
        set dpd on-idle
        set dhgrp 14 5
        set psksecret "MyFortiGateSecretKey2026"
    next
end

config vpn ipsec phase2-interface
    edit "Branch-HQ-Tunnel_p2"
        set phase1name "Branch-HQ-Tunnel"
        set proposal aes128-sha1
        set pfs disable
        set keylifeseconds 28800
    next
end
