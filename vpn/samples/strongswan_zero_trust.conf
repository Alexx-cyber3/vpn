# strongSwan swanctl.conf - Modern Zero-Trust IPsec VPN Profile (Grade A+)
# Compliant with NIST SP 800-77 Rev 1 & NSA CNSA 2.0 Standards

connections {
    cloud-gateway-prod {
        version = 2
        proposals = aes256gcm16-prfsha256-ecp256, aes256gcm16-prfsha384-ecp384
        rekey_time = 1h
        overtime = 10m
        jitter = 2m
        dpd_delay = 30s
        dpd_action = clear

        local {
            auth = pubkey
            certs = gatewayCert.pem
            id = vpn.enterprise.internal
        }
        remote {
            auth = pubkey
            id = client.enterprise.internal
        }
        children {
            corp-net {
                local_ts = 10.100.0.0/16
                remote_ts = 192.168.1.0/24
                esp_proposals = aes256gcm16-ecp256, aes256gcm16-ecp384
                rekey_time = 1h
                mode = tunnel
            }
        }
    }
}
